<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app-frame" [class.nav-collapsed]="collapsed()">
  <aside class="desktop-sidebar">
    <se-sidebar
      [collapsed]="collapsed()"
      [signingOut]="signingOut()"
      (logoutRequested)="requestLogout()"
    />
  </aside>
  <div class="workspace">
    <header class="app-header">
      <div class="header-start">
        <button
          seButton
          variant="ghost"
          class="desktop-only icon-button"
          type="button"
          [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
          [attr.aria-expanded]="!collapsed()"
          (click)="collapsed.set(!collapsed())"
        >
          <se-icon [name]="collapsed() ? 'expand' : 'collapse'" />
        </button>
        <button
          seButton
          variant="ghost"
          class="mobile-only icon-button"
          type="button"
          aria-label="Open navigation"
          [attr.aria-expanded]="mobileOpen()"
          (click)="mobileOpen.set(true)"
        >
          <se-icon name="menu" />
        </button>
        <div class="header-brand-lockup" aria-label="Mr. Livora workspace">
          <span class="header-brand-name">Mr. Livora</span>
        </div>
        <se-breadcrumbs />
      </div>
      <div class="header-actions">
        <se-society-switcher />
        <button
          seButton
          variant="ghost"
          class="icon-button"
          type="button"
          [attr.aria-label]="
            theme.theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme'
          "
          (click)="theme.toggle()"
        >
          <se-icon [name]="theme.theme() === 'light' ? 'moon' : 'sun'" />
        </button>
        <span class="header-divider" aria-hidden="true"></span>
        @if (auth.state.identity()) {
          <button
            seButton
            variant="ghost"
            class="icon-button"
            type="button"
            aria-label="Sign out"
            title="Sign out"
            [disabled]="signingOut()"
            (click)="requestLogout()"
          >
            <se-icon name="logout" />
          </button>
        } @else {
          <a seButton variant="ghost" routerLink="/login">Sign in <se-icon name="arrow" /></a>
        }
      </div>
    </header>
    <main id="main-content" tabindex="-1"><router-outlet (activate)="focusPage()" /></main>
    <footer class="app-footer">
      <span class="footer-tagline">Live in a Better Aura</span>
      <span class="copyright-label">© 2026 Mr. Livora</span>
    </footer>
  </div>
</div>
<se-drawer title="Navigation" side="start" [open]="mobileOpen()" (closed)="mobileOpen.set(false)"
  ><se-sidebar
    [signingOut]="signingOut()"
    (navigated)="mobileOpen.set(false)"
    (logoutRequested)="requestLogout()"
/></se-drawer>
<se-dialog
  class="confirmation-dialog logout-confirmation-dialog"
  title="Confirm logout"
  [open]="logoutConfirmationOpen()"
  (closed)="cancelLogout()"
>
  <div class="confirmation-message">
    <span class="confirmation-icon" aria-hidden="true"><se-icon name="logout" /></span>
    <div>
      <p class="confirmation-eyebrow">Secure sign out</p>
      <h3>Are you sure you want to log out?</h3>
      <p class="confirmation-description">
        You will need to sign in again to access your community workspace.
      </p>
    </div>
  </div>
  <div class="confirmation-actions">
    <button
      seButton
      variant="secondary"
      type="button"
      (click)="cancelLogout()"
      [disabled]="signingOut()"
    >
      Stay signed in
    </button>
    <button seButton type="button" (click)="logout()" [disabled]="signingOut()">
      {{ signingOut() ? 'Logging out...' : 'Log out' }}
    </button>
  </div>
</se-dialog>
